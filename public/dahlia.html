<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dahlia's Guide</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f0eb;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* Password screen */
  #login {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    padding: 20px;
    gap: 16px;
  }
  #login h1 { font-size: 24px; color: #2d2d2d; }
  #login p { color: #666; font-size: 14px; }
  #login input {
    padding: 12px 16px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    width: 260px;
    text-align: center;
    outline: none;
  }
  #login input:focus { border-color: #c4956a; }
  #login button {
    padding: 12px 32px;
    background: #c4956a;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
  }
  #login button:hover { background: #b07d52; }
  #login .error { color: #d44; font-size: 14px; display: none; }

  /* Chat screen */
  #app { display: none; flex-direction: column; height: 100dvh; }
  header {
    background: #c4956a;
    color: white;
    padding: 16px 20px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
  }
  header small {
    display: block;
    font-weight: 400;
    font-size: 13px;
    opacity: 0.85;
    margin-top: 2px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-line;
  }
  .msg.bot {
    background: white;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    color: #2d2d2d;
  }
  .msg.user {
    background: #c4956a;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.typing {
    background: white;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    color: #999;
    font-style: italic;
  }
  #input-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: white;
    border-top: 1px solid #e5e0db;
  }
  #q {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #e5e0db;
    border-radius: 20px;
    font-size: 15px;
    outline: none;
  }
  #q:focus { border-color: #c4956a; }
  #send {
    background: #c4956a;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .topics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .topics button {
    background: #f5ede5;
    border: 1px solid #e5ddd3;
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 13px;
    color: #8b6d4f;
    cursor: pointer;
    font-weight: 500;
  }
  .topics button:hover { background: #ebe1d5; }
</style>
</head>
<body>

<div id="login">
  <h1>Dahlia's Weekend Guide</h1>
  <p>Enter the password to get started</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="off">
  <button onclick="tryLogin()">Enter</button>
  <div class="error" id="pw-error">Wrong password, try again</div>
</div>

<div id="app">
  <header>
    Dahlia's Guide
    <small>Ask me anything about the weekend!</small>
  </header>
  <div id="chat"></div>
  <div id="input-row">
    <input id="q" type="text" placeholder="Ask a question..." autocomplete="off">
    <button id="send" onclick="ask()">Send</button>
  </div>
</div>

<script>
let password = '';
let messages = [];
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const sendBtn = document.getElementById('send');

document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !sendBtn.disabled) ask();
});

async function tryLogin() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;

  try {
    const res = await fetch('/.netlify/functions/dahlia-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw, messages: [{ role: 'user', content: 'hi' }] }),
    });

    if (res.status === 401) {
      document.getElementById('pw-error').style.display = 'block';
      return;
    }

    password = pw;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';

    addMsg("Hi! I know everything about Dahlia's routine, where things are, and how the house works. Just ask me anything! Here are some ideas:", 'bot');
    showTopics();
  } catch (e) {
    document.getElementById('pw-error').textContent = 'Something went wrong, try again';
    document.getElementById('pw-error').style.display = 'block';
  }
}

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function showTopics() {
  const div = document.createElement('div');
  div.className = 'topics';
  const samples = [
    "What's her bedtime routine?",
    "Where are the diapers?",
    "What does she eat?",
    "Where's the thermometer?",
    "What movies can she watch?",
    "What's the nap routine?",
    "Cat medicine?",
    "What does 'ha-hack' mean?",
  ];
  for (const s of samples) {
    const btn = document.createElement('button');
    btn.textContent = s;
    btn.onclick = () => { input.value = s; ask(); };
    div.appendChild(btn);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;

  addMsg(q, 'user');
  input.value = '';
  sendBtn.disabled = true;

  messages.push({ role: 'user', content: q });
  const typing = addMsg('Thinking...', 'typing');

  try {
    const res = await fetch('/.netlify/functions/dahlia-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, messages }),
    });

    const data = await res.json();
    typing.remove();

    if (data.error) {
      addMsg('Something went wrong. Try again!', 'bot');
    } else {
      addMsg(data.reply, 'bot');
      messages.push({ role: 'assistant', content: data.reply });
    }
  } catch (e) {
    typing.remove();
    addMsg('Connection error. Check your internet and try again.', 'bot');
  }

  sendBtn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
